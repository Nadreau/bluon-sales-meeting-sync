name: Sync daily sales meeting to Notion

# Mirrors Niko's daily sales-standup AI meeting note into the shared Bluon
# "Internal Sales Meetings" database so the whole sales team can read it.
#
# The standup is at 10:00am ET. The AI summary needs a few minutes to finish
# after the call, so we fire a few times in the late-morning ET window. The
# script is idempotent (it no-ops if today's entry already exists), so multiple
# runs are safe — the first run after the summary is ready does the work, the
# rest exit cleanly. Firing at several UTC offsets also covers EDT/EST so we
# never have to touch the cron for daylight-saving.
#
# THIS ACTION IS THE BACKSTOP, NOT THE PRIMARY PATH (changed Jul 31 2026).
# The primary trigger is now the local launchd agent com.bluon.sales-meeting-sync
# (see run_local.sh), which fires on time. This Action covers days the laptop is
# asleep. Whichever gets there first wins; the other no-ops.

on:
  schedule:
    # Jul 31 2026: was every-5-minutes (~32 fires/day). GitHub only ever
    # DELIVERED 4/day, and delayed the first one by 60–120 min — the entry
    # was landing ~12:00–12:40 ET for a 10:00 ET call, even though the Notion
    # AI summary is ready by ~10:20–10:55 ET. Dense schedules get deprioritized,
    # so asking for fewer fires gets better delivery than asking for more.
    # Five well-spaced fires, covering EDT and EST. Mon–Sat.
    # The call STARTS at 10:00 ET, so nothing fires before 10:45 — an earlier
    # check just burns a run while the meeting is still going.
    - cron: "45 14 * * 1-6"   # 10:45 ET (EDT)
    - cron: "15 15 * * 1-6"   # 11:15 ET (EDT) / 10:15 ET (EST)
    - cron: "0 16 * * 1-6"    # 12:00 ET (EDT) / 11:00 ET (EST)
    - cron: "0 17 * * 1-6"    # 13:00 ET (EDT) / 12:00 ET (EST)
    - cron: "45 17 * * 1-6"   # 13:45 ET (EDT) / 12:45 ET (EST) late fallback
  workflow_dispatch:
    inputs:
      date:
        description: "Target day YYYY-MM-DD (blank = today ET)"
        required: false
      force:
        description: "Force create even if an entry exists (true/false)"
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sales-meeting-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run sync
        env:
          NOTION_PERSONAL_TOKEN: ${{ secrets.NOTION_PERSONAL_TOKEN }}
          NOTION_BLUON_TOKEN: ${{ secrets.NOTION_BLUON_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python sync.py $ARGS
